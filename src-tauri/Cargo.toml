[package]
name = "furfolio"
version = "0.1.0"
description = "A private, local-first character reference library"
authors = []
edition = "2021"

[lib]
name = "furfolio_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
