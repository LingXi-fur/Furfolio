[package]
name = "furfolio"
version = "0.1.0"
description = "A private, local-first character reference library"
authors = []
edition = "2021"

[lib]
name = "furfolio_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "=2.6.3", features = [] }

[dependencies]
tauri = { version = "=2.11.5", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.37", features = ["bundled", "backup", "serialize"] }
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1", features = ["v4"] }
tauri-plugin-dialog = "=2.4.2"
image = { version = "0.25.8", default-features = false, features = ["png", "jpeg", "webp"] }
sha2 = "0.10"
cap-std = "3"
url = "2"

[features]
custom-protocol = ["tauri/custom-protocol"]

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "=0.59.0", features = ["Win32_Foundation", "Win32_Storage_FileSystem", "Win32_Security", "Win32_Security_Authorization", "Win32_System_IO", "Win32_System_Threading"] }
