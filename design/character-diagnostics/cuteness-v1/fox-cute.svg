<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="fox-cute-title fox-cute-desc">
  <title id="fox-cute-title">狐狸伙伴 · 可爱版定稿 v2</title>
  <desc id="fox-cute-desc">原创日系 Kemono 正面半身胸像：圆润大头、杏黄被毛、奶油色面罩与胸毛、深色耳尖、青绿色玻璃大眼、腮红与浅笑小虎牙。独立犬科狐骨架构图，非猫系换皮。</desc>
  <defs>
