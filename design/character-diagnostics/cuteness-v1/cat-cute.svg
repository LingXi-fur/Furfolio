<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="cat-cute-title cat-cute-desc">
  <title id="cat-cute-title">猫伙伴 · 可爱版定稿 v2</title>
  <desc id="cat-cute-desc">原创日系 Kemono 正面半身胸像：圆润大头、琥珀色玻璃大眼、腮红、粉色内耳与奶油色胸毛，淡紫灰被毛，温和微笑。独立猫科骨架，非狗系换皮。</desc>
  <defs>
    <clipPath id="cat-body-clip">
      <path d="M92 512 C96 448 128 400 184 378 C212 366 240 362 256 362 C272 362 300 366 328 378 C384 400 416 448 420 512 Z" />
    </clipPath>
  </defs>

  <!-- 颈（底端被身体覆盖） -->
  <path d="M212 300 L212 396 L300 396 L300 300 Z" fill="#C7CBDF" stroke="#3A3448" stroke-width="6" stroke-linejoin="round" />

  <!-- 肩与半身 -->
